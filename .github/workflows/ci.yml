name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.2', '7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint
        run: find shared opencart-3 tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Lint OpenCart 4 (PHP 8 only)
        if: startsWith(matrix.php, '8')
        run: find opencart-4 -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Offline tests
        run: php tests/run.php
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py --check
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
